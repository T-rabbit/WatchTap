plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.watchtap'
    compileSdk 35

    defaultConfig {
        applicationId "dev.watchtap"
        minSdk 31
        targetSdk 34
        versionCode 9
        versionName "2.7.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'io.github.libxposed:api:102.0.0'
}
